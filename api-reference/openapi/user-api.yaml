                  success:
                    type: boolean
                    example: true
                  partners:
                    type: array
                    items:
                      $ref: '#/components/schemas/AffiliatePartner'
                  next_cursor:
                    type: integer
                    nullable: true
                  counts:
                    type: object
                    properties: {}
