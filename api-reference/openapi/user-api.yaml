          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Create a product
      description: 'Codes: `SLUG_TAKEN`, `SKU_TAKEN`, `PLAN_LIMIT_REACHED` (plan''s product limit), `PHYSICAL_GOODS_NOT_ENABLED`.


        **Permission:** `products:write`'
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                  description: Generated from the name when omitted.
                type:
                  type: string
                  enum:
                  - file
                  - serial
                  - subscription
                  - donation
                  - contact
                  - physical
                  default: file
                product_kind:
                  type: string
                  enum:
                  - single
                  - variants
                  - donation
                status:
                  type: string
                  enum:
                  - draft
                  - active
                  - archived
                  default: draft
                active:
                  type: boolean
                visibility:
                  type: string
                  enum:
                  - public
                  - unlisted
                  - private
                best_seller:
                  type: boolean
                metadata:
                  type: object
                  properties: {}
                  additionalProperties:
                    type: string
                currency:
                  type: string
                price_cents:
                  type: integer
                  minimum: 0
                discount_percent:
                  type: number
                  minimum: 0
                  maximum: 100
                accepts_coupons:
                  type: boolean
                min_qty:
                  type: integer
                max_qty:
                  type: integer
                sell_limit:
                  type: integer
                  minimum: -1
                delivery_note:
                  type: string
                  nullable: true
                details:
                  $ref: '#/components/schemas/ProductDetails'
                seo:
                  $ref: '#/components/schemas/ProductSeo'
                category_ids:
                  type: array
                  items:
                    type: integer
                stock_alert_threshold:
                  type: integer
                  nullable: true
                media_urls:
                  type: array
                  description: Image URLs (http/https), max 50.
                  items:
                    type: string
                payment_methods:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentMethodToggle'
                donation_min_price_cents:
                  type: integer
                donation_suggested_price_cents:
                  type: integer
                subscription:
                  type: object
                  properties:
                    billing_interval:
                      type: string
                      enum:
                      - daily
                      - weekly
                      - monthly
                      - yearly
                    trial_days:
                      type: integer
                    auto_renew:
                      type: boolean
                    initial_price_cents:
                      type: integer
                    recurring_price_cents:
                      type: integer
                    delivery:
                      type: string
                      enum:
                      - file
                      - serial
                sku:
                  type: string
                  description: Physical only.
                physical:
                  type: object
                  properties:
                    weight_grams:
                      type: integer
                    handling_days:
                      type: integer
                    return_days:
                      type: integer
                    warranty_months:
                      type: integer
                    free_shipping:
                      type: boolean
                  description: Physical only.
                  additionalProperties: true
                options:
                  type: array
                  description: Physical only.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: Size
                      display_type:
                        type: string
                      values:
                        type: array
                        example:
                        - S
                        - M
                        - L
                        items:
                          type: string
                variants:
                  type: array
                  description: Required when `product_kind` is `variants`. Same fields as POST /products/{id}/variants.
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    success:
                      type: boolean
                      example: true
                - $ref: '#/components/schemas/ProductBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
