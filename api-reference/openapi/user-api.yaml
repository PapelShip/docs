                    - type: string
                disabled_payment_methods:
                  type: array
                  items:
                    type: string
                    example: BITCOIN
                  maxItems: 100
              required:
              - code
              - type
              - value
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  coupon:
                    $ref: '#/components/schemas/Coupon'
