    post:
      tags:
      - Fulfillment
      operationId: createShipment
      summary: Create a shipment
      description: 'Leave out `items` to ship everything not shipped yet. `shipped` emails the customer the tracking link unless `notify_customer` is false. Codes: `NOT_PAID`, `OVER_SHIPPED`, `CLOSED`.


        **Permission:** `fulfillment:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      invoice_item_id:
                        type: integer
                      qty:
                        type: integer
                carrier_code:
                  type: string
                  description: See `GET /shipping` for codes.
                  example: dhl_express
                carrier_name:
                  type: string
                tracking_number:
                  type: string
                tracking_url:
                  type: string
                  description: Leave empty to use the carrier's tracking page.
                location_id:
                  type: integer
                  description: Ship-from location.
                status:
                  type: string
                  enum:
                  - shipped
                  - label_created
                  default: shipped
                notify_customer:
                  type: boolean
                  default: true
                note:
                  type: string
              required:
              - carrier_code
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  shipment_id:
                    type: integer
