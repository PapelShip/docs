  /analytics:
    get:
      tags:
      - Analytics
      operationId: getAnalytics
      summary: Sales summary
      description: 'Sales are counted when paid. Without dates the whole history is used. `revenue` is in the store currency; `revenue_by_currency` covers every currency.


        **Permission:** `analytics:read`'
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: '`YYYY-MM-DD` or ISO date-time (UTC).'
      - in: query
        name: to
        schema:
          type: string
        description: Inclusive when a date.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  analytics:
                    type: object
                    properties:
                      revenue:
                        type: object
                        properties:
                          cents:
                            type: integer
                            example: 352620
                          net_cents:
                            type: integer
                            example: 337912
                          refunded_cents:
                            type: integer
                            example: 14708
                          currency:
                            type: string
                            example: USD
                      revenue_by_currency:
                        type: array
                        items:
                          type: object
                          properties:
                            currency:
                              type: string
                            orders:
                              type: integer
                            gross_cents:
                              type: integer
                            refunded_cents:
                              type: integer
                            net_cents:
                              type: integer
                      orders:
                        type: object
                        properties:
                          total:
                            type: integer
                          completed:
                            type: integer
                      customers:
                        type: object
                        properties:
                          total:
                            type: integer
                          buyers_in_range:
                            type: integer
                          new_buyers_in_range:
                            type: integer
                      period:
                        type: object
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
