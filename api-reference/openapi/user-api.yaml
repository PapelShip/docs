          example: c35ffd-19a1b2c3d4e-8c7a20
        object:
          type: string
          enum:
          - invoice
          example: invoice
        status:
          type: string
          description: '`pending` waits for payment; `completed` is paid and delivered; `cancelled` and `expired` are closed.'
          enum:
          - pending
          - payment_pending
          - payment_processing
          - partial_payment
          - manual_review_pending
          - completed
          - cancelled
          - expired
          example: pending
        currency:
          type: string
