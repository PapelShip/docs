openapi: 3.0.3
info:
  title: PapelShip Store API
  version: 1.0.0
  description: 'Manage your PapelShip store from your own systems: create orders, sync products and stock, ship physical orders, answer support tickets and react to events.


    Every request needs your API key in `x-api-key` and your store ID in `x-store-hash`. Amounts are integers in minor units (`2999` = 29.99). Dates are ISO 8601 in UTC.'
  contact:
    name: PapelShip Support
    email: support@papelship.com
    url: https://papelship.com
servers:
- url: https://app.papelship.com/api/v1
  description: Production
security:
- ApiKey: []
  StoreHash: []
tags:
- name: Account
  description: Your key, store and payment methods.
- name: Orders
  description: Create orders, take manual payments, cancel, refund and read deliveries.
- name: Products
  description: Products and their settings.
- name: Variants & stock
  description: Variants, physical stock and license keys.
- name: Product content
  description: Media, SEO, payment methods, files and stock alerts.
- name: Categories
  description: Organise products.
- name: Groups
  description: Collections of products.
- name: Coupons
  description: Discount codes.
- name: Customers
  description: Buyers and their history.
- name: Blocklist
  description: Emails and IPs that can't place orders.
- name: Reviews
  description: Customer reviews.
- name: Support
  description: Support tickets.
- name: Subscriptions
  description: Recurring products and auto-renewals.
- name: Fulfillment
  description: Ship physical orders.
- name: Returns
  description: Return requests.
- name: Shipping settings
  description: Zones, rates and locations.
- name: Webhooks
  description: Endpoints, deliveries and event types.
- name: Affiliates
  description: Partner programme.
- name: Analytics
  description: Sales summary.
paths:
  /me:
    get:
      tags:
      - Account
      operationId: getMe
      summary: Get the current key
      description: Returns the store, the key's permissions and your API limits. Works with any valid key; use it to test credentials.
      responses:
        '200':
          description: Key information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  store:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 0bHQn0bU2dei
                      name:
                        type: string
                        example: Acme
                      slug:
                        type: string
                        example: acme
                      currency:
                        type: string
                        example: USD
                  key:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        example: Order sync
                      prefix:
                        type: string
                        example: pk_live_3f9a
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: '2026-10-04T12:00:00.000Z'
                      permissions:
                        type: object
                        properties: {}
                        description: 'Access per area: `none`, `read` or `write`.'
                        additionalProperties:
                          type: string
                          enum:
                          - none
                          - read
                          - write
                        example:
                          orders: write
                          products: read
                          webhooks: none
                  limits:
                    type: object
                    properties:
                      requests_per_minute:
                        type: integer
                        example: 300
                      monthly_quota:
                        type: integer
                        nullable: true
                        example: 100000
                      used_this_month:
                        type: integer
                        example: 4210
                      quota_resets_at:
                        type: string
                        format: date-time
                        example: '2026-10-04T12:00:00.000Z'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /invoices:
    get:
      tags:
      - Orders
      operationId: listInvoices
      summary: List orders
      description: 'Newest first. Add `expand=items` to include line items.


        **Permission:** `orders:read`'
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - payment_pending
          - payment_processing
          - partial_payment
          - manual_review_pending
          - completed
          - cancelled
          - expired
      - in: query
        name: email
        schema:
          type: string
        description: Exact customer email.
      - in: query
        name: q
        schema:
          type: string
        description: Search in order ID and email.
      - in: query
        name: paid
        schema:
          type: boolean
        description: '`true` = paid orders only, `false` = unpaid only.'
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00.000Z'
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00.000Z'
      - in: query
        name: expand
        schema:
          type: string
          enum:
          - items
      - in: query
        name: limit
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Items per page (1–100).
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Number of items to skip.
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
      - Orders
      operationId: createInvoice
      summary: Create an order
      description: 'Creates an order and returns its `checkout_url`, where the customer picks a payment method and pays. Prices, stock, coupons, product rules, fraud checks, shipping and affiliate attribution work exactly as on your storefront.


        For physical products send `shipping_address`; without it the customer enters the address on the checkout page. The order expires after 3 hours if unpaid.


        **Permission:** `orders:write`'
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_email:
                  type: string
                  format: email
                  description: Buyer email. Receives the invoice email and the delivery.
                  example: buyer@example.com
                delivery_email:
                  type: string
                  format: email
                  description: Send the delivery to a different address.
                items:
                  type: array
                  description: 1–50 lines. Prices come from your catalogue; you cannot set them.
                  items:
                    type: object
                    properties:
                      product_id:
                        oneOf:
                        - type: string
                        - type: integer
                        description: Product hash ID (or numeric ID).
                        example: a1B2c3D4e5F6
                      variant_id:
                        type: integer
                        description: Required for products with variants.
                      quantity:
                        type: integer
                        default: 1
                        minimum: 1
                        maximum: 10000
                      donation_amount_cents:
                        type: integer
                        description: Required for donation products.
                    required:
                    - product_id
                  minItems: 1
                  maxItems: 50
                coupon_code:
                  type: string
                  description: Applied if valid for these products. An invalid coupon is ignored.
                  example: SUMMER10
                currency:
                  type: string
                  description: Must match the products' currency. Defaults to it.
                  example: USD
                expected_total_cents:
                  type: integer
                  description: Optional safety check. If the server total differs by more than 1 cent, the call fails with `TOTAL_MISMATCH`.
                custom_fields:
                  type: object
                  properties: {}
                  description: Answers to your checkout fields, keyed by field key.
                  additionalProperties:
                    type: string
                shipping_address:
                  $ref: '#/components/schemas/ShippingAddress'
                shipping_rate_id:
                  type: integer
                  description: Rate from POST /shipping/quote. Without it the cheapest rate is used.
                customer_ip:
                  type: string
                  description: Buyer's IP address. Enables your fraud, VPN and blocklist rules for this order.
                  example: 203.0.113.10
                affiliate_code:
                  type: string
                  description: Partner link code to credit (affiliate programme).
                  example: alex
                send_email:
                  type: boolean
                  description: Send the invoice email to the customer.
                  default: true
                metadata:
                  type: object
                  properties: {}
                  description: Up to 20 keys (≤40 chars) with string values (≤500 chars). Returned on the order and in webhooks of your systems.
                  additionalProperties:
                    type: string
                  example:
                    order_ref: WEB-1042
              required:
              - customer_email
              - items
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /invoices/{invoiceId}:
    get:
      tags:
      - Orders
      operationId: getInvoice
      summary: Get an order
      description: 'Includes items, shipping address and custom fields.


        **Permission:** `orders:read`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Orders
      operationId: updateInvoice
      summary: Update an order
      description: 'Change `metadata` (merged; `null` removes a key) or `delivery_email` (before completion). Change the status with the action endpoints.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  properties: {}
                  additionalProperties:
                    type: string
                    nullable: true
                delivery_email:
                  type: string
                  format: email
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - Orders
      operationId: deleteInvoice
      summary: Cancel an order (alias)
      description: 'Same as `POST /invoices/{invoiceId}/cancel`. Kept for older integrations.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /invoices/{invoiceId}/complete:
    post:
      tags:
      - Orders
      operationId: completeInvoice
      summary: Mark as paid and deliver
      description: 'Use when you received the payment outside PapelShip (bank transfer, cash). Completes the order, delivers the products and sends `order.completed`. Calling it again on a completed order retries delivery.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: string
                  description: Label stored on the order.
                  example: BANK_TRANSFER
      responses:
        '200':
          description: The completed order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamFailed'
  /invoices/{invoiceId}/cancel:
    post:
      tags:
      - Orders
      operationId: cancelInvoice
      summary: Cancel an unpaid order
      description: 'Releases reserved stock and sends `order.cancelled`. Paid orders return `INVOICE_PAID` (refund them instead); orders with a payment in progress return `PAYMENT_IN_PROGRESS`.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /invoices/{invoiceId}/refund:
    post:
      tags:
      - Orders
      operationId: refundInvoice
      summary: Record a refund
      description: 'Records money you paid back outside PapelShip. Reverses affiliate commission and sends `order.refunded`. Codes: `INVOICE_NOT_PAID`, `ALREADY_REFUNDED`, `REFUND_TOO_LARGE`.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  description: Defaults to the rest of the order.
                  minimum: 1
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Refund recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                  refund:
                    type: object
                    properties:
                      refunded_cents:
                        type: integer
                      refund_status:
                        type: string
                    additionalProperties: true
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /invoices/{invoiceId}/deliveries:
    get:
      tags:
      - Orders
      operationId: listInvoiceDeliveries
      summary: List deliveries
      description: 'License keys, files and notes delivered for the order.


        **Permission:** `orders:read`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delivery'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoiceId}/void:
    post:
      tags:
      - Orders
      operationId: voidInvoice
      summary: Cancel an order (old name)
      description: 'Same as `/cancel`.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      deprecated: true
  /invoices/{invoiceId}/force-delivery:
    post:
      tags:
      - Orders
      operationId: forceDelivery
      summary: Retry delivery (old name)
      description: 'Retries delivery of a paid order. Prefer `/complete`.


        **Permission:** `orders:write`'
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          example: c35ffd-19a1b2c3d4e-8c7a20
        description: Public order ID.
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: '#/components/schemas/Invoice'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamFailed'
      deprecated: true
  /categories:
    get:
      tags:
      - Categories
      operationId: listCategorys
      summary: List categorys
      description: '**Permission:** `catalog:read`'
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search name or slug.
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: parent_id
        schema:
          type: string
        description: Category ID or `null` for top level.
      - in: query
        name: limit
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Items per page (1–100).
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Number of items to skip.
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  categorys:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
      - Categories
      operationId: createCategory
      summary: Create a category
      description: '**Permission:** `catalog:write`'
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
        description: Unique key (for example a UUID) that makes retries safe. The first response is stored for 24 hours and replayed for retries with the same key and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 191
                slug:
                  type: string
                  description: Lowercase letters, digits and dashes. Generated from the name when omitted.
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                icon:
                  type: string
                  nullable: true
                active:
                  type: boolean
                  default: true
                parent_id:
                  type: integer
                  description: Category of this store. `null` = top level.
                  nullable: true
                position:
                  type: integer
                product_ids:
                  type: array
                  description: Product IDs or hash IDs of this store (max 1000). Replaces the current list; `[]` or `null` clears it.
                  items:
                    oneOf:
                    - type: integer
                    - type: string
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  category:
                    $ref: '#/components/schemas/Category'
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductRef'
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
