                  format: email
                name:
                  type: string
                note:
                  type: string
                  description: Private.
              required:
              - email
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: 7fKq2LmN9xPa3RtB
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /affiliates/conversions:
