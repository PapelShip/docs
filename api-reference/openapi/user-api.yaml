components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Store API key (`pk_live_...`). Create it in **Developers › API keys**.
    StoreHash:
      type: apiKey
      in: header
      name: x-store-hash
      description: The ID of the store the request is for. Shown in **Developers › API keys**.
  responses:
    BadRequest:
      description: 'The request could not be processed.


        Codes: `INVALID_REQUEST`, `INVALID_JSON`, `INVALID_ID`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: INVALID_REQUEST
            error: Request body must be valid JSON
            request_id: req_7YbK2mQ9xP1cRt4v
    Unauthorized:
      description: 'Missing, invalid or expired API key.


        Codes: `MISSING_API_KEY`, `MISSING_STORE_HASH`, `INVALID_API_KEY`, `API_KEY_EXPIRED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: INVALID_API_KEY
            error: Invalid API Key
            request_id: req_7YbK2mQ9xP1cRt4v
    Forbidden:
      description: 'The key is not allowed to do this.


        Codes: `INSUFFICIENT_SCOPE`, `IP_NOT_ALLOWED`, `STORE_NOT_ALLOWED`, `STORE_API_NOT_IN_PLAN`, `FEATURE_NOT_ENABLED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: INSUFFICIENT_SCOPE
            error: This API key needs the orders:write permission
            request_id: req_7YbK2mQ9xP1cRt4v
    NotFound:
      description: 'The record does not exist in this store.


        Codes: `NOT_FOUND`, `STORE_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: NOT_FOUND
            error: Invoice not found
            request_id: req_7YbK2mQ9xP1cRt4v
    Conflict:
      description: 'The record is in a state that does not allow this action.


        Codes: `IDEMPOTENCY_IN_PROGRESS`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: INVOICE_PAID
            error: A paid order cannot be cancelled. Refund it instead.
            request_id: req_7YbK2mQ9xP1cRt4v
    Gone:
      description: This endpoint was retired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: ENDPOINT_RETIRED
            error: This endpoint has been retired from the Store API.
            request_id: req_7YbK2mQ9xP1cRt4v
    ValidationFailed:
      description: 'A field is missing or invalid. `details.field` names it.


        Codes: `VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REUSED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: VALIDATION_FAILED
            error: customer_email must be a valid email address
            request_id: req_7YbK2mQ9xP1cRt4v
    RateLimited:
      description: 'Too many requests. Wait `Retry-After` seconds.


        Codes: `RATE_LIMITED` (300 requests per minute per key), `STORE_API_MONTHLY_QUOTA_EXCEEDED` (your plan''s monthly quota).'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: RATE_LIMITED
            error: Too many requests. The limit is 300 requests per minute per key.
            request_id: req_7YbK2mQ9xP1cRt4v
    UpstreamFailed:
      description: A third party (payment provider, delivery) failed. Retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            code: DELIVERY_FAILED
            error: The order was completed but delivery failed. Retry the call to deliver again.
            request_id: req_7YbK2mQ9xP1cRt4v
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: Machine-readable error code. Branch on this, not on the message.
          example: VALIDATION_FAILED
        error:
          type: string
          description: Human-readable message.
          example: customer_email must be a valid email address
        details:
          type: object
          properties: {}
          description: Extra context, for example `field` for validation errors.
          additionalProperties: true
        request_id:
          type: string
          description: Include this when you contact support.
          example: req_7YbK2mQ9xP1cRt4v
      required:
      - success
      - code
      - error
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching records.
          example: 128
        limit:
          type: integer
          example: 25
        offset:
          type: integer
          example: 0
        has_more:
          type: boolean
          description: '`true` when another page exists.'
          example: true
    InvoiceItem:
      type: object
      properties:
        id:
          type: integer
          example: 8812
        product_id:
          type: string
          description: Product hash ID.
          nullable: true
          example: a1B2c3D4e5F6
        product_name:
          type: string
          example: Pro License
        variant_id:
          type: integer
          nullable: true
        quantity:
          type: integer
          example: 1
        unit_price_cents:
          type: integer
          example: 2999
        discount_percent:
          type: number
          example: 0
        total_cents:
          type: integer
          example: 2999
    ShippingAddress:
      type: object
      properties:
        full_name:
          type: string
          example: Alex Morgan
        company:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          example: +44 20 7946 0958
        email:
          type: string
          nullable: true
        country_code:
          type: string
          description: ISO 3166-1 alpha-2.
          example: GB
        region:
          type: string
          description: State, province or county.
          nullable: true
          example: Greater London
        city:
          type: string
          nullable: true
          example: London
        district:
          type: string
          nullable: true
        line1:
