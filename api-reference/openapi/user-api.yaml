  /affiliates/partners:
    get:
      tags:
      - Affiliates
      operationId: listAffiliatePartners
      summary: List partners
      description: 'Needs the affiliate programme (`FEATURE_NOT_ENABLED` otherwise). 25 per page, cursor based.


        **Permission:** `affiliates:read`'
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - active
          - suspended
          - banned
          - rejected
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: integer
        description: '`next_cursor` from the previous page.'
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema:
                type: object
